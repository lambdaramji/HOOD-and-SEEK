# PR이 건드린 경로로 area:/contract-change/safety-invariant 라벨을 자동으로 붙입니다.
# 규칙은 .github/labeler.yml. 라벨이 저장소에 없으면 실패하므로 scripts/github/setup-labels.sh 를 먼저 돌립니다.
name: Label PR by path

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
