# 작성자가 아닌 사람이 병합하면 PR에 경고 댓글을 남깁니다 — 막지는 못하고 기록만 합니다.
#
# 팀 규칙 「병합은 작성자가」(CONTRIBUTING.md §1, 2026-10-22 PM 결정). GitHub는 병합 버튼을 누를 사람을
# 병합 전에 알 수 없어서 status check로는 막을 수 없습니다. 그래서 병합 뒤에 남깁니다.
# 작성자가 auto-merge를 켜 두었다가 병합된 경우는 병합자가 작성자로 기록되어 댓글이 없습니다.
# 댓글을 쓰려면 쓰기 토큰이 필요해 labeler.yml처럼 pull_request_target을 씁니다. 코드를 checkout하지 않고
# 이벤트의 로그인 이름만 env로 넘기므로 PR 내용이 실행되지 않습니다. 워크플로는 main에 있는 것이 돕니다.
name: Merge watch

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write

jobs:
  merged_by_author:
    if: github.event.pull_request.merged == true && github.event.pull_request.merged_by.login != github.event.pull_request.user.login
    runs-on: ubuntu-latest
    steps:
      - name: 작성자 아닌 병합 기록
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGER: ${{ github.event.pull_request.merged_by.login }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments" -f body="⚠ 이 PR은 작성자 @$AUTHOR 가 아니라 @$MERGER 님이 병합했습니다. 팀 규칙(CONTRIBUTING.md §1)은 「병합은 작성자가」입니다. 부득이하게 대신 병합했다면 이 댓글에 사유를 남겨 주세요." >/dev/null
          echo "작성자 @$AUTHOR, 병합 @$MERGER — 경고 댓글 남김" | tee -a "$GITHUB_STEP_SUMMARY"
