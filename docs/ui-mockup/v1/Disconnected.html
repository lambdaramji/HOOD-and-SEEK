@keyframes hs-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.hs-fan{transform-box:fill-box;transform-origin:center}
.hs-fan-1{animation:hs-spin 2s linear infinite}.hs-fan-2{animation:hs-spin 1.1s linear infinite}.hs-fan-3{animation:hs-spin .6s linear infinite}
.hs-ring-on circle:nth-child(2){animation:hs-breathe 2.4s ease-in-out infinite}
.hs-halo{animation:hs-halo 1.8s ease-out infinite}.hs-halo-ind{--hs-halo:rgba(240,118,31,.35)}
.hs-pill{height:30px;padding:0 12px;border-radius:15px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:8px;align-self:center;white-space:nowrap}
.hs-pill-ind{background:#FDEBDD;color:#B5410A}.hs-pill-hood{background:#ECEEF1;color:#1A1A1A}
.hs-dot{width:8px;height:8px;border-radius:4px;background:currentColor;animation:hs-pulse 1.2s ease-in-out infinite}
.hs-wave>span{transform-origin:center;animation:hs-wave 1s ease-in-out infinite}
.hs-wave>span:nth-child(2){animation-delay:.12s}.hs-wave>span:nth-child(3){animation-delay:.24s}.hs-wave>span:nth-child(4){animation-delay:.36s}.hs-wave>span:nth-child(5){animation-delay:.48s}
.hs-ripple{animation:hs-ripple 1.8s ease-out infinite}.hs-ripple-2{animation-delay:.6s}
.hs-caret{animation:hs-blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
