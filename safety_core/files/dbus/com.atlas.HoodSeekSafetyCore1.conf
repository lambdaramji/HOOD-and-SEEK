<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- SafetyCore는 root systemd 유닛으로 실행한다 (#46). 설치 프로그램이 패키지 계정 정책을 덧붙인다. -->
  <policy user="root">
    <allow own="com.atlas.HoodSeekSafetyCore1"/>
    <allow send_destination="com.atlas.HoodSeekSafetyCore1"/>
    <allow receive_sender="com.atlas.HoodSeekSafetyCore1"/>
  </policy>

  <policy context="default">
    <deny send_destination="com.atlas.HoodSeekSafetyCore1"/>
    <!-- 읽기 전용 상태 조회만 공개 -->
    <allow send_destination="com.atlas.HoodSeekSafetyCore1"
           send_interface="com.atlas.HoodSeekSafetyCore1"
           send_member="GetState"/>
  </policy>
</busconfig>
