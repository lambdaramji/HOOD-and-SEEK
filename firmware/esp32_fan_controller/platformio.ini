[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; 워치독 시험 전용 (CI는 default_envs만 빌드): USB 시리얼로 'H' → loop 멈춤 → 2 s 뒤 리셋 확인
[env:wdt_test]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DHOODSEEK_WDT_TEST
